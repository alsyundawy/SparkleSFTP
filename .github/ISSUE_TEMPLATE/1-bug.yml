name: Bug Report
description: Report a bug or unexpected behavior in SparkleSFTP
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        > **Security Reminder:** Never paste passwords, passphrases, private SSH keys, or unredacted sensitive host logs into public issues.
  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      placeholder: e.g. macOS 15.1 Sequoia / macOS 14.7 Sonoma / macOS 13.7 Ventura
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac Architecture
      options:
        - Apple Silicon (arm64)
        - Intel (x86_64)
        - Universal Binary
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol / Component
      options:
        - SFTP
        - SSH Terminal (SwiftTerm)
        - FTPS (Explicit / Implicit)
        - FTP (Plain)
        - SCP Fallback
        - Dual-Pane File Manager
        - Transfer Queue / Recovery
        - Keychain / Host Trust
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SparkleSFTP Version / Commit
      placeholder: e.g. v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of what happened vs. what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted Logs / Diagnostics
      description: Paste sanitized diagnostics only (no passwords, keys, or private host tokens).
