---
# MegaLinter v10 Configuration for SparkleSFTP
# Documentation: https://megalinter.io/latest/configuration/
# Tuned for SparkleSFTP's actual stack: Swift 6, Clibcurl C bridge, Bash, XML plist/entitlements,
# JSON/Package.resolved, YAML/Docker Compose, GitHub Actions, Markdown docs, and Betterleaks secret scanning.

APPLY_FIXES: none
DEFAULT_BRANCH: main

# Scope linters strictly to existing repository file types & tools (MegaLinter v10)
ENABLE_LINTERS:
  - SWIFT_SWIFTLINT
  - C_CPPCHECK
  - C_CLANG_FORMAT
  - BASH_BASH_EXEC
  - BASH_SHELLCHECK
  - BASH_SHFMT
  - MARKDOWN_MARKDOWNLINT
  - YAML_YAMLLINT
  - JSON_JSONLINT
  - XML_XMLLINT
  - ACTION_ACTIONLINT
  - REPOSITORY_BETTERLEAKS

# Exclude build outputs, SwiftPM caches, Xcode metadata, and local tooling caches
ADDITIONAL_EXCLUDED_DIRECTORIES:
  - .build
  - .swiftpm
  - DerivedData
  - build
  - dist
  - .trunk
  - .kilo
  - megalinter-reports
  - .scannerwork
  - reports

FILTER_REGEX_EXCLUDE: (^(\.build|\.swiftpm|DerivedData|build|dist|\.trunk|\.kilo|\.scannerwork|reports|megalinter-reports)/|\.xcodeproj/.*\.pbxproj$)

# Linter Configuration Bindings
# Note: MegaLinter's swiftlint descriptor sets cli_config_arg_name="" and appends "--strict" automatically
SWIFT_SWIFTLINT_CONFIG_FILE: .swiftlint.yml

C_CPPCHECK_ARGUMENTS: "--language=c --enable=warning,performance,portability --suppress=missingIncludeSystem --suppress=unusedFunction -I src/Packages/Clibcurl/include"
C_CLANG_FORMAT_CONFIG_FILE: .clang-format

BASH_SHELLCHECK_ARGUMENTS: "-s bash"
BASH_SHFMT_ARGUMENTS: "-i 2 -ci"

MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdownlint.json
YAML_YAMLLINT_CONFIG_FILE: .yamllint.yml

JSON_JSONLINT_FILE_EXTENSIONS:
  - .json
  - .resolved

XML_XMLLINT_ARGUMENTS: "--noout"
XML_XMLLINT_FILE_EXTENSIONS:
  - .xml
  - .plist
  - .entitlements

REPOSITORY_BETTERLEAKS_CONFIG_FILE: .betterleaks.toml

# Output, Reporting & Performance
SHOW_ELAPSED_TIME: true
FILE_IO_MULTITHREADING: true
PRINT_ALPACA: false
GITHUB_COMMENT_REPORTER: false
