---
extends: default

ignore: |
  .build/
  .swiftpm/
  DerivedData/
  build/
  dist/
  .trunk/
  megalinter-reports/

rules:
  line-length: disable
  truthy: disable
  comments-indentation: disable
  comments:
    min-spaces-from-content: 1
  key-duplicates: {}
  octal-values:
    forbid-implicit-octal: true
  document-start: disable
