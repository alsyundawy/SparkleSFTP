services:
  sftp-server:
    image: atmoz/sftp:latest
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - ./fixtures/sftp-users.conf:/etc/sftp/users.conf:ro
      - ./fixtures/test-files:/home/testuser/upload
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  openssh-server:
    image: lscr.io/linuxserver/openssh-server:latest
    ports:
      - "127.0.0.1:2223:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - USER_NAME=sparkletest
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=sparkletestpass
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ftp-server:
    image: fauria/vsftpd:latest
    ports:
      - "127.0.0.1:2121:21"
      - "127.0.0.1:21100-21110:21100-21110"
    environment:
      - FTP_USER=testuser
      - FTP_PASS=testpass
      - PASV_ADDRESS=127.0.0.1
      - PASV_MIN_PORT=21100
      - PASV_MAX_PORT=21110
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 21 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  proftpd:
    image: instantlinux/proftpd:latest
    ports:
      - "127.0.0.1:2122:21"
      - "127.0.0.1:2990:990"
    environment:
      - FTP_USER=ftpsuser
      - FTP_PASS=ftpspass
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 21 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
