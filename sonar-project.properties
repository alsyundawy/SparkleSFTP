sonar.projectKey=sparkle-sftp
sonar.projectName=SparkleSFTP
sonar.projectVersion=0.3.0
sonar.sources=src
sonar.tests=Tests
sonar.sourceEncoding=UTF-8
sonar.exclusions=.build/**,.swiftpm/**,DerivedData/**,build/**,dist/**,.trunk/**,megalinter-reports/**,reports/**
