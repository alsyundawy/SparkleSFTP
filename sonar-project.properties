sonar.projectKey=sparkle-sftp
sonar.projectName=SparkleSFTP
sonar.projectVersion=0.2.0
sonar.sources=src
sonar.tests=Tests
sonar.sourceEncoding=UTF-8
sonar.exclusions=.build/**,.swiftpm/**,DerivedData/**,build/**,dist/**,.trunk/**,megalinter-reports/**,reports/**
# `swiftlint lint --reporter sonarqube` emits SonarQube Generic Issue Import JSON (`issues[]`).
sonar.externalIssuesReportPaths=reports/swiftlint-sonarqube.json
sonar.c.file.suffixes=.c,.h
sonar.cfamily.build-wrapper-output.bypass=true
